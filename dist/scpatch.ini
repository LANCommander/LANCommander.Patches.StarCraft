; scpatch local options. Only per-machine settings belong here; anything that affects gameplay is a game
; rule chosen by the lobby host.

[SavePaths]
; Store saved games, characters, replays, error logs and screenshots in
; %USERPROFILE%\Saved Games\Blizzard Entertainment\StarCraft
Enabled=1
; On first run, copy existing data from the install folder (originals are left untouched)
MigrateExisting=1

[Renderer]
; Replace the game's 640x480 exclusive-fullscreen DirectDraw output with a Direct3D 11 presenter
Enabled=1
; 0 = borderless fullscreen on the desktop, 1 = a normal window
Windowed=0
; Window client size as a multiple of 640x480 (windowed mode only)
WindowScale=2
; aspect = largest 4:3 fit, integer = largest whole multiple, stretch = fill the window
Scaling=aspect
; sharp = crisp pixels with smooth edges at non-integer scales, nearest = plain pixel doubling
Filter=sharp
VSync=1

[Network]
; Larger UDP socket buffers for the LAN (UDP) and Battle.net providers, so a burst of turn packets is not
; dropped by Windows. Local only; works with unpatched players. Also logs per-session datagram counts.
Enabled=1
; Receive/send buffer size in KB (0 = Windows defaults, statistics only)
SocketBufferKB=256

[Widescreen]
; Wider map view during matches, with the bottom HUD centred. Menus stay 640x480. Requires [Renderer].
Enabled=1
; 0 = pick from the display's aspect ratio; 768 (16:10) or 896 (~16:9); 640 = off
Width=0
; HUD size in matches, in percent: 100, 88, 79, 71, 65 or 60 (nearest is used). A smaller HUD makes the
; in-match screen taller (and wider to match), with the HUD at the bottom: more map is visible. Without
; [Zoom] the map is drawn at the HUD's pixel size; with it the map keeps its normal scale. The in-game menu's
; Options > Controls > HUD Size saves a choice (registry, like Game Speed) that overrides this from the next start.
HudSize=100

[FramePacing]
; Smoother output at high refresh rates. Game speed is unchanged.
Enabled=1
; 1 ms game clock: steady simulation frame pacing (e.g. an even 42 ms on Fastest instead of 31/47 ms)
HighResolutionTimer=1
; Spread each scroll step across display frames instead of jumping once per ~16 ms
SmoothScrolling=1
; Redraw rate cap while scrolling; 0 = match the display's refresh rate
MaxFps=0
; Pixel grid for in-between scroll positions. 8 matches the game's own step sizes and is the only fully
; correct value: below 8 the fog-of-war overlay, which is drawn on an 8 px grid, lags terrain by up to 7 px
; until the next 8 px boundary (cosmetic only).
ScrollGranularity=8

[Zoom]
; In development. Draws the map and the UI into separate buffers during matches, so the map can be zoomed
; while the HUD stays the same size. Requires [Widescreen].
Enabled=0
; Starting map scale in percent: 100 = normal, 75 = zoomed out (a third more map visible each way), 50 = the most.
Level=100
; Mouse wheel zooms during matches (around the cursor), between 100 and MinLevel
Wheel=1
MinLevel=50
; Zoom change per wheel notch in percent (5-50)
WheelSpeed=15
; Palette index (1-13) that marks "map shows through here" in the UI buffer
KeyIndex=1
; Diagnostic only: log which palette indices and layers draw the HUD during matches (scpatch.log). No visual
; change; costs a little CPU per frame.
Probe=0

[Selection]
; Maximum units per selection and control group: 12 (vanilla) or 24. The "Selection Limit" dropdown on the
; multiplayer Create Game screen overrides this once used: its choice is saved like Game Speed (registry,
; Blizzard Entertainment\Starcraft, "Selection Limit") and also applies to single-player games. Applies to single-player games,
; replays, and multiplayer games you host. A hosted game uses 24 only if every player has scpatch; otherwise it
; is vanilla for everyone. Joining follows the host's choice whatever this says. The HUD shows the first 12
; units. Saves keep the first 12 of each selection.
Limit=12
; Key that flips the unit panel between units 1-12 and 13-24 when more than 12 are selected (Windows virtual-key
; code; 9 = Tab). A new selection shows units 1-12.
PageKey=9

[Rally]
; Workers trained at a building whose rally point is on a mineral field or on your own refinery, assimilator
; or extractor start harvesting it (vanilla: they walk there and stand idle). Applies to single-player games and
; to multiplayer games you host; the "Rally Mining" dropdown on the multiplayer Create Game screen overrides
; this once used (saved like Game Speed). A hosted game uses it only if every player has scpatch with this
; option; otherwise it is vanilla. Joining follows the host's choice. Replays play back with the setting they
; were recorded with.
Mining=1
; Mark the rally point of each selected building (yours; any player's in a replay) with the yellow targeting
; cursor on the map and a yellow dot on the minimap. Display only.
ShowFlag=1

[Matches]
; Report multiplayer games you host to LANCommander, through the LANCommander Interposer built into this patch:
; players, races, eliminations, results, the score screen's totals and the replay. Only the host reports, so each
; game is reported once; joining players report nothing. Where the report goes is set in .interposer\Config.yml
; (MatchStatistics: ServerUrl, Token, GameId). Without those, LANCommander's launcher delivers it if it started
; the game; otherwise it is only logged (.interposer\Logs, with Logging.Matches: true).
Enabled=1
; Attach LastReplay.rep to the match. A copy is kept for the upload in Saved Games\...\StarCraft\Matches and
; deleted after 14 days.
AttachReplay=1

[Controls]
; Command card hotkeys. Default = the game's own letters. Grid = the keys follow the 3x3 card, like Age of
; Empires II: Q W E for the top row, A S D for the middle, Z X C for the bottom. Local only. The in-game menu's
; Options > Controls switches it during a match and saves the choice (registry, like Game Speed), which then
; overrides this.
Hotkeys=Default
